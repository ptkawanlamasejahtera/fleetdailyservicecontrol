name: Sync Fleet Data (Fallback)

# Sekarang cuma JARING PENGAMAN — jalur utama update instan sudah dilakukan
# langsung dari Google Sheet (push ke GitHub tiap ada edit, lihat
# checkAndPushToGithub_ di Apps Script). Workflow ini jalan tiap 30 menit
# buat jaga-jaga kalau jalur push dari sheet gagal/berhenti karena suatu hal.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ambil data terbaru dari Apps Script
        run: |
          curl -sL --fail --max-time 60 \
            "https://script.google.com/macros/s/AKfycbw41oPEoWHSecaueq-cBa-kXohm5tJPqaK4fiy8FYf-VjeyVbEZ4JGQM5ycPebD_X7J/exec" \
            -o data.json

      - name: Validasi hasil (harus JSON valid & tidak kosong)
        run: |
          if [ ! -s data.json ]; then
            echo "data.json kosong, batalkan commit."
            exit 1
          fi
          python3 -m json.tool data.json > /dev/null

      - name: Sisipkan timestamp sinkronisasi (biar dashboard tahu data ini se-fresh apa)
        run: |
          python3 -c "
          import json, datetime
          with open('data.json') as f:
              data = json.load(f)
          data['_syncedAt'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          with open('data.json', 'w') as f:
              json.dump(data, f, ensure_ascii=False)
          "

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto-update data fleet $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
